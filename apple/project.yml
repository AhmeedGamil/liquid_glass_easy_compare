name: AppleReference
options:
  bundleIdPrefix: dev.lgcompare
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AppleReference:
    type: application
    platform: iOS
    sources:
      - path: AppleReference
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lgcompare.apple
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Apple
        TARGETED_DEVICE_FAMILY: "1"
  CompareUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CompareUITests
    dependencies:
      - target: AppleReference
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lgcompare.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: AppleReference
schemes:
  AppleReference:
    build:
      targets:
        AppleReference: all
        CompareUITests: [test]
    test:
      targets:
        - CompareUITests
