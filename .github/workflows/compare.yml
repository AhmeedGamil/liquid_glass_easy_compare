name: Compare

on:
  workflow_dispatch:
    inputs:
      mode:
        description: record = clips + compare page, live = remote screen, both = run the two side by side
        type: choice
        options: [both, record, live]
        default: both
      live_minutes:
        description: How long the live Mac stays up (cancel the run to end sooner)
        type: number
        default: 45
      browser_remote:
        description: Also serve the slower browser remote on port 8765 (WebDriverAgent)
        type: boolean
        default: false
      include_package:
        description: Also build and record the liquid_glass_easy app next to Apple
        type: boolean
        default: false
      package_ref:
        description: liquid_glass_easy branch, tag or commit to compare
        type: string
        default: main
      device:
        description: Simulator model
        type: string
        default: iPhone 17 Pro
      flutter_version:
        type: string
        default: 3.41.2
      runner:
        description: macOS runner image (needs Xcode 26)
        type: string
        default: macos-26

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  record:
    if: inputs.mode != 'live'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-apps
        with:
          package_ref: ${{ inputs.package_ref }}
          flutter_version: ${{ inputs.flutter_version }}
          device: ${{ inputs.device }}
          build_package: ${{ inputs.include_package }}

      - name: Record Apple
        run: python3 tools/record.py --udid "$UDID" --app apple --out site/clips --project apple/AppleReference.xcodeproj --derived build/dd

      - name: Record package
        if: inputs.include_package
        run: python3 tools/record.py --udid "$UDID" --app package --out site/clips --project apple/AppleReference.xcodeproj --derived build/dd

      - name: Stamp the run
        run: |
          SHA=""
          if [ -f package_app/pubspec.lock ]; then
            SHA=$(grep -A6 "liquid_glass_easy:" package_app/pubspec.lock | grep resolved-ref | awk '{print $2}' | tr -d '"')
          fi
          python3 - <<EOF
          import json
          p = "site/clips/manifest.json"
          m = json.load(open(p))
          m["run"] = {
              "package_ref": "${{ inputs.include_package && inputs.package_ref || '' }}",
              "package_sha": "$SHA",
              "device": "${{ inputs.device }}",
              "xcode": "$(xcodebuild -version | head -1)",
              "run_id": "${{ github.run_id }}",
          }
          json.dump(m, open(p, "w"), indent=2)
          EOF
          ls -la site/clips site/clips/shots

      - uses: actions/upload-artifact@v4
        with:
          name: clips
          path: site/clips

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: record
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  live:
    if: inputs.mode != 'record'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-apps
        with:
          package_ref: ${{ inputs.package_ref }}
          flutter_version: ${{ inputs.flutter_version }}
          device: ${{ inputs.device }}
          build_package: ${{ inputs.include_package }}

      - name: Open the simulator window
        run: |
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          sleep 5
          xcrun simctl launch "$UDID" dev.lgcompare.apple

      # The browser remote: WebDriverAgent streams the simulator's screen
      # and takes touches, straight from the simulator, so the Mac's own
      # lock screen never gets in the way.
      - name: Start the browser remote
        if: inputs.browser_remote
        run: |
          git clone --depth 1 https://github.com/appium/WebDriverAgent.git build/WebDriverAgent
          xcodebuild build-for-testing \
            -project build/WebDriverAgent/WebDriverAgent.xcodeproj -scheme WebDriverAgentRunner \
            -destination "id=$UDID" -derivedDataPath build/wda CODE_SIGNING_ALLOWED=NO | tail -5
          nohup xcodebuild test-without-building \
            -project build/WebDriverAgent/WebDriverAgent.xcodeproj -scheme WebDriverAgentRunner \
            -destination "id=$UDID" -derivedDataPath build/wda > wda.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:8100/status >/dev/null && break
            sleep 2
          done
          curl -s http://127.0.0.1:8100/status | head -c 400; echo
          nohup python3 tools/remote.py --port 8765 > remote.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/ >/dev/null && break
            sleep 1
          done
          # Self-test through the same proxy the page uses; a failure here
          # is logged, not fatal, so the session still comes up.
          mkdir -p vnc-debug
          curl -s -m 120 -X POST http://127.0.0.1:8765/wda/session -H 'Content-Type: application/json' \
            -d '{"capabilities":{"alwaysMatch":{},"firstMatch":[{}]}}' -o session.json -w "session http %{http_code}\n" || true
          head -c 300 session.json; echo
          SID=$(python3 -c "import json; d=json.load(open('session.json')); print(d.get('sessionId') or d['value']['sessionId'])" 2>/dev/null || true)
          if [ -n "$SID" ]; then
            curl -s -m 60 -X POST "http://127.0.0.1:8765/wda/session/$SID/wda/apps/launch" -H 'Content-Type: application/json' \
              -d '{"bundleId":"dev.lgcompare.apple"}' | head -c 200; echo
          fi
          curl -s --max-time 4 http://127.0.0.1:8765/stream -o vnc-debug/stream.mjpeg || true
          ls -la vnc-debug
          cat remote.log
          tail -20 wda.log

      - name: Turn on screen sharing
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: bash tools/start_vnc.sh

      - uses: actions/upload-artifact@v4
        with:
          name: vnc-debug
          path: vnc-debug
          if-no-files-found: ignore

      - name: Join your tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: lg-compare-mac

      - name: Stay up
        run: |
          IP=$(tailscale ip -4 2>/dev/null || true)
          echo "::notice title=Connect::VNC: lg-compare-mac ($IP) port 5900. Cancel this run to shut it down."
          # Idle is what locks the screen; declare user activity all along.
          caffeinate -dimsu &
          END=$(( $(date +%s) + ${{ inputs.live_minutes }} * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            echo "live, $(( (END - $(date +%s)) / 60 )) min left"
            # Bring the browser remote back if either half has died.
            if [ "${{ inputs.browser_remote }}" = "true" ] && ! curl -sf -m 5 http://127.0.0.1:8100/status >/dev/null; then
              echo "restarting WebDriverAgent"
              nohup xcodebuild test-without-building \
                -project build/WebDriverAgent/WebDriverAgent.xcodeproj -scheme WebDriverAgentRunner \
                -destination "id=$UDID" -derivedDataPath build/wda >> wda.log 2>&1 &
            fi
            if [ "${{ inputs.browser_remote }}" = "true" ] && ! curl -sf -m 5 http://127.0.0.1:8765/ >/dev/null; then
              echo "restarting the remote page"
              nohup python3 tools/remote.py --port 8765 >> remote.log 2>&1 &
            fi
            for _ in 1 2 3 4; do caffeinate -u -t 1; sleep 14; done
          done
