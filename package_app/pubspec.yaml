name: glass_package
description: "liquid_glass_easy side of the Apple comparison."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # The workflow rewrites `ref` to the `package_ref` input, so any branch,
  # tag or commit of the package can be put next to Apple's glass.
  liquid_glass_easy:
    git:
      url: https://github.com/AhmeedGamil/liquid_glass_easy.git
      ref: main

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/backgrounds/
