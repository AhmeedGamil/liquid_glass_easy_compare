<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Compare</title>
<style>
  :root {
    --bg: #f4f4f6; --panel: #ffffff; --ink: #14151a; --muted: #6b6e78;
    --line: #e2e3e8; --accent: #0a84ff; --apple: #0a84ff; --pkg: #ff6a3d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f12; --panel: #17181d; --ink: #f1f2f5; --muted: #8d909b;
      --line: #2a2c33; --accent: #4aa3ff; --apple: #4aa3ff; --pkg: #ff8a63;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 20px; margin: 4px 0 2px; letter-spacing: -0.2px; }
  .meta { color: var(--muted); font-size: 12.5px; margin-bottom: 14px; word-break: break-word; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 13.5px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .label { color: var(--muted); font-size: 12px; margin-right: 2px; min-width: 44px; }
  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .stage.stack { grid-template-columns: 1fr; max-width: 460px; margin-left: auto; margin-right: auto; }
  .pane { position: relative; background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 402 / 874; }
  .pane video, .pane img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .tag {
    position: absolute; top: 8px; left: 8px; z-index: 3; font-size: 11px; font-weight: 700;
    letter-spacing: .8px; padding: 3px 8px; border-radius: 6px; color: #fff;
  }
  .tag.apple { background: var(--apple); }
  .tag.pkg { background: var(--pkg); }
  .wipe-line { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; z-index: 2; pointer-events: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
  .btn {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer; min-width: 44px;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .readout { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .empty { padding: 30px 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Apple Liquid Glass vs liquid_glass_easy</h1>
  <div class="meta" id="meta">Loading…</div>

  <div class="row" id="scenes"></div>
  <div class="row">
    <span class="label">Show</span>
    <button class="chip" data-src="clip" aria-pressed="true">Motion</button>
    <button class="chip" data-src="shot" aria-pressed="false">At rest</button>
  </div>
  <div class="row">
    <span class="label">View</span>
    <button class="chip" data-view="side" aria-pressed="true">Side by side</button>
    <button class="chip" data-view="wipe" aria-pressed="false">Wipe</button>
    <button class="chip" data-view="flip" aria-pressed="false">Flip</button>
  </div>

  <div id="stage" class="stage"></div>

  <div id="wipeRow" style="display:none;margin-top:10px">
    <input type="range" id="wipe" min="0" max="100" value="50" aria-label="Wipe position">
  </div>

  <div class="controls" id="motionControls">
    <button class="btn primary" id="play">Pause</button>
    <button class="btn" id="back" aria-label="Previous frame">‹ frame</button>
    <button class="btn" id="fwd" aria-label="Next frame">frame ›</button>
    <button class="btn" id="restart">Restart</button>
    <span class="label" style="margin-left:6px">Speed</span>
    <span id="speeds"></span>
  </div>
  <div class="controls" id="syncControls">
    <span class="label">Sync</span>
    <button class="btn" id="nudgeMinus">− 0.05 s</button>
    <button class="btn" id="nudgePlus">+ 0.05 s</button>
    <span class="readout" id="readout"></span>
  </div>
  <div class="hint" id="hint"></div>
</main>

<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const FRAME = 1 / 60;
  const LEAD = 0.4, TAIL = 0.8;
  let manifest;
  try {
    manifest = await (await fetch('clips/manifest.json', { cache: 'no-store' })).json();
  } catch (e) {
    $('meta').textContent = 'No recording yet. Run the Compare workflow with mode "record" or "both".';
    return;
  }

  const run = manifest.run || {};
  $('meta').textContent = [
    run.package_ref && `package ${run.package_ref}${run.package_sha ? ' @ ' + run.package_sha.slice(0, 7) : ''}`,
    run.device, run.xcode, run.run_id && `run ${run.run_id}`,
  ].filter(Boolean).join(' · ');

  const sceneNames = Object.keys((manifest.apple || {}).scenes || {});
  if (!sceneNames.length) { $('stage').innerHTML = '<div class="empty">The recording has no scene marks.</div>'; return; }

  const state = {
    scene: sceneNames[0], src: 'clip', view: 'side', speed: 1, playing: true,
    nudge: 0, flipShowPkg: false, wipe: 50,
  };
  try { Object.assign(state, JSON.parse(localStorage.getItem('glass-compare') || '{}'), { playing: true }); } catch (e) {}
  if (!sceneNames.includes(state.scene)) state.scene = sceneNames[0];
  const save = () => { try { localStorage.setItem('glass-compare', JSON.stringify(state)); } catch (e) {} };

  // Two panes, each holding a video and a still; the view decides layout.
  const make = (who, cls, text) => {
    const pane = document.createElement('div');
    pane.className = 'pane';
    const video = document.createElement('video');
    Object.assign(video, { muted: true, playsInline: true, preload: 'auto' });
    video.src = 'clips/' + manifest[who].video;
    const img = document.createElement('img');
    img.alt = `${text} at rest`;
    const tag = document.createElement('div');
    tag.className = 'tag ' + cls; tag.textContent = text;
    pane.append(video, img, tag);
    return { pane, video, img, tag, who };
  };
  const A = make('apple', 'apple', 'APPLE');
  const P = make('package', 'pkg', 'PACKAGE');
  const line = document.createElement('div'); line.className = 'wipe-line';

  const span = (who) => {
    const s = (manifest[who].scenes || {})[state.scene] || {};
    return { start: s.start ?? 0, end: s.end ?? (s.start ?? 0) + 10 };
  };

  function layout() {
    const stage = $('stage');
    stage.replaceChildren();
    stage.className = 'stage' + (state.view === 'side' ? '' : ' stack');
    for (const x of [A, P]) {
      x.pane.style.display = ''; x.pane.style.position = '';
      for (const el of [x.video, x.img]) el.style.clipPath = '';
      x.video.style.display = state.src === 'clip' ? '' : 'none';
      x.img.style.display = state.src === 'shot' ? '' : 'none';
    }
    if (state.view === 'side') {
      stage.append(A.pane, P.pane);
    } else {
      // One pane, the package layered over Apple.
      stage.append(A.pane);
      A.pane.append(P.video, P.img, P.tag, line);
      P.tag.style.left = 'auto'; P.tag.style.right = '8px';
    }
    if (state.view === 'side') {
      P.pane.append(P.video, P.img, P.tag);
      P.tag.style.left = ''; P.tag.style.right = '';
      line.remove();
    }
    applyOverlay();
    $('wipeRow').style.display = state.view === 'wipe' ? '' : 'none';
    $('motionControls').style.display = state.src === 'clip' ? '' : 'none';
    $('syncControls').style.display = state.src === 'clip' ? '' : 'none';
    $('hint').textContent = state.view === 'flip'
      ? 'Tap the picture to flip between Apple and the package.'
      : state.view === 'wipe' ? 'Drag the slider: left of the line is the package, right is Apple.' : '';
  }

  function applyOverlay() {
    const pkgEls = [P.video, P.img];
    if (state.view === 'wipe') {
      for (const el of pkgEls) { el.style.clipPath = `inset(0 ${100 - state.wipe}% 0 0)`; el.style.visibility = ''; }
      line.style.left = state.wipe + '%'; line.style.display = '';
      P.tag.style.display = ''; A.tag.style.display = '';
    } else if (state.view === 'flip') {
      for (const el of pkgEls) { el.style.clipPath = ''; el.style.visibility = state.flipShowPkg ? '' : 'hidden'; }
      line.style.display = 'none';
      P.tag.style.display = state.flipShowPkg ? '' : 'none';
      A.tag.style.display = state.flipShowPkg ? 'none' : '';
    } else {
      for (const el of pkgEls) { el.style.visibility = ''; }
      P.tag.style.display = ''; A.tag.style.display = '';
    }
  }

  function loadScene() {
    A.img.src = `clips/shots/apple-${state.scene}.png`;
    P.img.src = `clips/shots/package-${state.scene}.png`;
    restart();
    for (const b of $('scenes').children) b.setAttribute('aria-pressed', String(b.dataset.scene === state.scene));
  }

  function restart() {
    A.video.currentTime = Math.max(0, span('apple').start - LEAD);
    syncPkg(true);
    if (state.playing) play();
  }

  // Apple drives the clock; the package follows it, offset to its own marks.
  function syncPkg(force) {
    const t = span('package').start + (A.video.currentTime - span('apple').start) + state.nudge;
    if (force || Math.abs(P.video.currentTime - t) > 0.04) P.video.currentTime = Math.max(0, t);
  }

  function play() {
    state.playing = true; $('play').textContent = 'Pause';
    for (const v of [A.video, P.video]) { v.playbackRate = state.speed; v.play().catch(() => {}); }
  }
  function pause() {
    state.playing = false; $('play').textContent = 'Play';
    A.video.pause(); P.video.pause(); syncPkg(true);
  }
  function step(dir) {
    pause();
    A.video.currentTime = Math.max(0, A.video.currentTime + dir * FRAME);
    syncPkg(true);
  }

  function tick() {
    if (state.src === 'clip') {
      const s = span('apple');
      if (A.video.currentTime > s.end + TAIL) restart();
      else if (state.playing) syncPkg(false);
      const rel = A.video.currentTime - s.start;
      $('readout').textContent = `t ${rel.toFixed(2)} s · offset ${state.nudge >= 0 ? '+' : ''}${state.nudge.toFixed(2)} s`;
    }
    requestAnimationFrame(tick);
  }

  // Controls.
  for (const name of sceneNames) {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.scene = name; b.textContent = name;
    b.onclick = () => { state.scene = name; save(); loadScene(); };
    $('scenes').append(b);
  }
  for (const s of [1, 0.5, 0.25, 0.1]) {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = s + '×'; b.style.marginRight = '4px';
    b.setAttribute('aria-pressed', String(state.speed === s));
    b.onclick = () => {
      state.speed = s; save();
      for (const c of $('speeds').children) c.setAttribute('aria-pressed', String(c === b));
      for (const v of [A.video, P.video]) v.playbackRate = s;
    };
    $('speeds').append(b);
  }
  const group = (attr, key) => document.querySelectorAll(`[data-${attr}]`).forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset[attr] === state[key]));
    b.onclick = () => {
      state[key] = b.dataset[attr]; save();
      document.querySelectorAll(`[data-${attr}]`).forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
      layout();
    };
  });
  group('src', 'src'); group('view', 'view');
  $('wipe').value = state.wipe;
  $('wipe').oninput = (e) => { state.wipe = +e.target.value; save(); applyOverlay(); };
  $('stage').onclick = () => { if (state.view === 'flip') { state.flipShowPkg = !state.flipShowPkg; applyOverlay(); } };
  $('play').onclick = () => (state.playing ? pause() : play());
  $('back').onclick = () => step(-1);
  $('fwd').onclick = () => step(1);
  $('restart').onclick = restart;
  $('nudgeMinus').onclick = () => { state.nudge -= 0.05; save(); syncPkg(true); };
  $('nudgePlus').onclick = () => { state.nudge += 0.05; save(); syncPkg(true); };

  layout();
  A.video.addEventListener('loadedmetadata', loadScene, { once: true });
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
